<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Generador de Enlaces SEMOVI - Panel de Control</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">
    <div class="max-w-xl w-full bg-white p-8 rounded-2xl shadow-xl border border-gray-200">
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold text-gray-800">Generador de Enlaces SEMOVI</h1>
            <p class="text-sm text-gray-500 mt-1">Configura los datos del documento y genera tu enlace seguro con Token Secret aleatorio.</p>
        </div>

        <form id="generatorForm" class="space-y-4">
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Token Secret (Automático y Aleatorio)</label>
                <div class="flex gap-2">
                    <input type="text" id="token" class="w-full bg-gray-50 border border-gray-300 rounded-lg p-2.5 text-sm font-mono text-gray-600" readonly>
                    <button type="button" onclick="generateToken()" class="bg-gray-200 hover:bg-gray-300 text-gray-700 px-4 py-2 rounded-lg text-sm font-medium transition">Regenerar</button>
                </div>
            </div>

            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Fecha de Expedición</label>
                <input type="text" id="exp" value="17/11/2025" class="w-full border border-gray-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-[#9d2148] focus:outline-none">
            </div>

            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Tipo / Subtipo de Documento</label>
                <input type="text" id="tipo" value="LICENCIAS / TIPO: A" class="w-full border border-gray-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-[#9d2148] focus:outline-none">
            </div>

            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Folio de Documento</label>
                <input type="text" id="folio" value="N16542850" class="w-full border border-gray-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-[#9d2148] focus:outline-none">
            </div>

            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Estado de Validez</label>
                <select id="valido" class="w-full border border-gray-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-[#9d2148] focus:outline-none">
                    <option value="true">Válido ("Su documento es válido")</option>
                    <option value="false">No válido / Vencido</option>
                </select>
            </div>

            <button type="button" onclick="generateLink()" class="w-full bg-[#9d2148] hover:bg-[#801b3b] text-white font-bold py-3 rounded-lg transition shadow-md">
                Generar Enlace Automático
            </button>
        </form>

        <div id="resultBox" class="mt-6 hidden p-4 bg-gray-50 border border-gray-200 rounded-xl">
            <h3 class="text-sm font-bold text-gray-700 mb-2">Enlace Generado Exitosamente:</h3>
            <div class="flex items-center gap-2 mb-3">
                <input type="text" id="finalUrl" class="w-full bg-white border border-gray-300 rounded-lg p-2 text-xs font-mono text-gray-600" readonly>
                <button onclick="copyToClipboard()" class="bg-blue-600 hover:bg-blue-700 text-white px-3 py-2 rounded-lg text-xs font-medium whitespace-nowrap">Copiar</button>
            </div>
            <a id="openLinkBtn" href="#" target="_blank" class="block text-center w-full bg-green-600 hover:bg-green-700 text-white text-sm font-semibold py-2 rounded-lg transition">
                Abrir Página de Validación
            </a>
        </div>
    </div>

    <script>
        function generateToken() {
            const array = new Uint8Array(16);
            window.crypto.getRandomValues(array);
            const token = Array.from(array, byte => byte.toString(16).padStart(2, '0')).join('');
            document.getElementById('token').value = token;
        }

        // Generar token al cargar la página
        generateToken();

        function generateLink() {
            const token = document.getElementById('token').value;
            const exp = document.getElementById('exp').value;
            const tipo = document.getElementById('tipo').value;
            const folio = document.getElementById('folio').value;
            const valido = document.getElementById('valido').value;

            const baseUrl = window.location.origin + '/validador';
            const params = new URLSearchParams({
                token: token,
                exp: exp,
                tipo: tipo,
                folio: folio,
                valido: valido
            });

            const fullUrl = baseUrl + '?' + params.toString();

            document.getElementById('finalUrl').value = fullUrl;
            document.getElementById('openLinkBtn').href = fullUrl;
            document.getElementById('resultBox').classList.remove('hidden');
        }

        function copyToClipboard() {
            const copyText = document.getElementById('finalUrl');
            copyText.select();
            document.execCommand('copy');
            alert('¡Enlace copiado al portapapeles!');
        }
    </script>
</body>
</html>
